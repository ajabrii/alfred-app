name: Build Alfred

# Builds native Alfred apps on real macOS, Windows, and Linux runners.
# - Push a tag like v0.1.0  -> builds everything and publishes a GitHub Release.
# - Or run it by hand from the Actions tab (workflow_dispatch) to get artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64
          - os: macos-15
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Test setup
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build
        run: pyinstaller --noconfirm packaging/alfred.spec

      # ---- package one native artifact per OS ----
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/Alfred
          mv dist/Alfred "Alfred-${{ matrix.label }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Move-Item dist/Alfred.exe "Alfred-${{ matrix.label }}.exe"
        shell: pwsh

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname Alfred -srcfolder "dist/Alfred.app" \
            -ov -format UDZO "Alfred-${{ matrix.label }}.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alfred-${{ matrix.label }}
          path: |
            Alfred-${{ matrix.label }}
            Alfred-${{ matrix.label }}.exe
            Alfred-${{ matrix.label }}.dmg
          if-no-files-found: error

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Alfred-${{ matrix.label }}
            Alfred-${{ matrix.label }}.exe
            Alfred-${{ matrix.label }}.dmg
          fail_on_unmatched_files: false
          body: |
            Alfred ${{ github.ref_name }} — download the file for your OS:
            • macOS (Apple Silicon): Alfred-macos-arm64.dmg
            • macOS (Intel): Alfred-macos-x86_64.dmg
            • Windows: Alfred-windows-x86_64.exe
            • Linux: Alfred-linux-x86_64 (chmod +x, then run)

            First launch: your OS will warn it's from an unidentified developer
            (these builds aren't code-signed yet). See the README for how to open
            it anyway. On first run, choose Claude CLI, Codex CLI, or your own
            Anthropic API key. CLI backends require the CLI installed and signed in.
