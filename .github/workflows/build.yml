name: Build Alfred

# Builds native Alfred apps on real macOS, Windows, and Linux runners.
# - Push a tag like v0.1.0  -> builds everything and publishes a GitHub Release.
# - Or run it by hand from the Actions tab (workflow_dispatch) to get artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64
          - os: macos-15
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Test setup
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build
        run: pyinstaller --noconfirm packaging/alfred.spec

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: PYTHONPATH=. python packaging/linux.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ALFRED_VERSION = python -c "from alfred import __version__; print(__version__)"
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { choco install innosetup --yes --no-progress }
          & $compiler packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          VERSION=$(python -c 'from alfred import __version__; print(__version__)')
          pkgbuild --component dist/Alfred.app --install-location /Applications \
            --identifier com.alfred.agent --version "$VERSION" \
            "release/Alfred-Setup-${{ matrix.label }}.pkg"

      - name: Verify Linux installer
        if: runner.os == 'Linux'
        run: |
          dpkg-deb --info release/Alfred-ubuntu-debian-amd64.deb
          dpkg-deb --extract release/Alfred-ubuntu-debian-amd64.deb /tmp/alfred-installed
          /tmp/alfred-installed/opt/alfred/Alfred --version
          test -f /tmp/alfred-installed/usr/share/applications/alfred.desktop

      - name: Verify Windows install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "alfred-install-test"
          $install = Start-Process release/Alfred-Setup-windows-x86_64.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$target" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed" }
          if (!(Test-Path "$target/Alfred.exe")) { throw "App missing after install" }
          $uninstall = Start-Process "$target/unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed" }
          if (Test-Path "$target/Alfred.exe") { throw "App remains after uninstall" }

      - name: Verify Mac installer payload
        if: runner.os == 'macOS'
        run: |
          pkgutil --payload-files "release/Alfred-Setup-${{ matrix.label }}.pkg" > payload.txt
          grep 'Alfred.app/Contents/MacOS/Alfred' payload.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alfred-${{ matrix.label }}
          path: release/*
          if-no-files-found: error

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          body: |
            Download the installer for your computer, open it, and follow the setup wizard.
            Windows: Alfred-Setup-windows-x86_64.exe
            Mac (Apple Silicon): Alfred-Setup-macos-arm64.pkg
            Mac (Intel): Alfred-Setup-macos-x86_64.pkg
            Ubuntu / Debian (X11, 64-bit Intel/AMD): Alfred-ubuntu-debian-amd64.deb

            Open Alfred from your applications after installation. Choose Claude or Codex,
            click Install & connect, and approve the provider's browser sign-in.
            These preview installers are not code-signed. See the website docs for
            platform requirements, permissions and opening an unsigned installer.
